<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>走错山头了 · 404</title>
<link rel="icon" href="assets/cover1-400.jpg">
<style>
  :root { --accent:#ffcf5c; --glow:rgba(255,180,60,.55); }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100svh; display:grid; place-items:center;
    background:#0d0a04; color:#f7ece2; text-align:center; padding:24px;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background-image:radial-gradient(90% 70% at 50% 0%, rgba(255,190,70,.22), transparent 60%);
  }
  .box{ max-width:420px; }
  h1{
    font-size:clamp(4rem,18vw,7rem); margin:0; line-height:1; font-weight:900;
    background:linear-gradient(180deg,#fff8e1,#ffe08a 45%,#f5b942 80%,#c9861a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 24px var(--glow));
  }
  p{ color:#c9b3a4; line-height:1.7; margin:16px 0 26px; }
  a{
    display:inline-block; padding:13px 26px; border-radius:99px;
    color:#2a1b00; text-decoration:none; font-weight:700;
    background:linear-gradient(160deg,#ffeaa6,#ffc247 55%,#e09112);
    box-shadow:0 10px 26px -8px var(--glow);
  }
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>这条路没通向苦行山。<br>回主舞台继续听歌吧。</p>
    <a href="./">返回首页</a>
  </div>
</body>
</html>
